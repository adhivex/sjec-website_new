name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Generates next-env.d.ts and route types (gitignored) before type-checking.
      - run: npm run typecheck

      # Same command Hostinger runs: builds sqlite.db from drizzle/ + seed, then next build.
      - run: npm run build
