name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Generates next-env.d.ts and route types (gitignored) before type-checking.
      - run: npm run typecheck

      # Same command Hostinger runs: builds sqlite.db from drizzle/ + seed, then next build.
      - run: npm run build

      # The page must render without JavaScript: hidden-until-hydration content
      # looked broken on real phones and passed every emulated check.
      - name: Content renders without JavaScript
        run: |
          npm run start &
          npx wait-on http://localhost:3000 -t 60000
          node scripts/check-no-js.mjs http://localhost:3000
